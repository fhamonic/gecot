# Documentation site (Zensical, successor of Material for MkDocs).
# Preview locally with:  pip install zensical && zensical serve

[project]
site_name = "GECOT"
site_description = "Graph-based Ecological Connectivity Optimization Tool — which conservation or restoration actions to fund, within a budget, to best connect a landscape."
site_url = "https://fhamonic.github.io/gecot/"
repo_url = "https://github.com/fhamonic/gecot"
repo_name = "fhamonic/gecot"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]
# MathJax: the config file must precede the library, which reads window.MathJax
# once at load and ignores anything set later.
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "A first run" = "getting-started/first-run.md" },
  ] },
  { "Using GECOT" = [
    { "Instance files" = "usage/instance.md" },
    { "Optimizing" = "usage/optimize.md" },
    { "Results and logs" = "usage/results.md" },
    { "Bounding" = "usage/bound.md" },
    { "Choosing an algorithm" = "usage/choosing.md" },
  ] },
  { "Formulations" = [
    { "Problem and notation" = "formulations/problem.md" },
    { "The flow formulation" = "formulations/flow.md" },
    { "Preprocessing" = "formulations/preprocessing.md" },
    { "Benders decompositions" = "formulations/benders.md" },
    { "Tree and path relaxations" = "formulations/relaxations.md" },
    { "Heuristics" = "formulations/heuristics.md" },
    { "Bounds" = "formulations/bounds.md" },
  ] },
  { "Reference" = [
    { "Parameters" = "reference/parameters.md" },
    { "Notation" = "reference/notation.md" },
  ] },
]

[project.validation.links]
anchors = "warn"

[project.theme]
# Zensical's own look: Inter / JetBrains Mono, lucide icons.
variant = "modern"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
